# ===================================================================
# CONFIGURACIÓN DEL SISTEMA - BANCO DE ALIMENTOS INTELIGENTE MEDELLÍN
# ===================================================================

server.port=8080
server.servlet.context-path=/

spring.application.name=banco-alimentos

# 1. Configuración de Base de Datos MySQL (XAMPP por defecto)
# Crea automáticamente la base de datos si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/banco_alimentos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Configuración Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# 4. Configuración del Módulo de Inteligencia Artificial (Groq Cloud API)
# Modelo de inferencia de alta capacidad listado en la cuenta del usuario
groq.api.key=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
